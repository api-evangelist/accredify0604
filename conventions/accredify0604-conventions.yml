    meta: PaginationMeta (current_page, from, last_page, per_page, to, total)
  quirk: >-
    Dashboard v2 GET /courses documents that setting per_page to -1 returns ALL courses
    without pagination. An agent iterating pages should not assume per_page is bounded by
    the declared enum on every operation.
  applies_to: >-
    Nexus Workflow and Auth list operations, and Dashboard v2 list operations. Dashboard v1
    is unpaginated.
