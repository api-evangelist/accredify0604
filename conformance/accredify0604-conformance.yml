note: >-
  Accredify's market is verifiable credentials, and unusually for this pipeline the
  domain-standard claim is verifiable from the CONTRACT rather than from marketing prose:
  nexus.accredify.io serves live OID4VCI issuer metadata declaring mso_mdoc credential
  configurations whose doctypes are the ISO/IEC 18013-5 mDL and ISO/IEC 23220 photo ID
  identifiers. Standards asserted only on the marketing page and not evidenced by a
  fetched machine-readable artifact are recorded with conforms: false and the prose URL,
  so the distinction stays visible.
