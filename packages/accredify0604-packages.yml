note: >-
  Accredify publishes no API client SDK for the Nexus or Dashboard APIs on any registry.
  What it does publish under its own org namespaces (Packagist accredifysg/*, npm
  @accredify/*) are the verifiable-credential building blocks its own platform runs on:
  a Laravel Singpass/MyInfo login integration, a PHP JSON-LD 1.1 implementation, a PHP
  W3C RDF Dataset Canonicalization (RDFC-1.0) implementation, and a fast PHP Keccak/SHAKE
  extension. These are official first-party libraries but they are cryptography and
  credential-standards infrastructure, not clients for the REST APIs documented in openapi/.
  Every version and published date below was read from the registry metadata endpoint
  on 2026-09-06.
