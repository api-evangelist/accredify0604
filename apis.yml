- aid: accredify0604-nexus
  name: Accredify Nexus API
  description: 'The Accredify Nexus platform API. OAuth 2.0 client-credentials REST
    API split across three published OpenAPI 3.1 modules: Auth (organisation users,
    groups, roles, user tokens, token issuance), Workflow (workflows, workflow runs,
    documents, design templates, document templates, courses) and Verification (verify
