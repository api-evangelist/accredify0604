- aid: accredify0604-dashboard
  name: Accredify Dashboard API
  description: 'The Accredify Dashboard API, published as two OpenAPI 3.1 documents.
    v1 covers OAuth 2.0 authorization-code grant and refresh, OpenBadges issuance,
    update and revocation, batch upload (JSON and Excel), issue-on-upload, certificate
    revocation by hash, email dispatch and an external-app certificate lookup. v2 covers
    batches, batch items, courses, documents, templates, email templates and the
    institution access matrix. Bearer JWT authentication; a UAT sandbox host is
    published in the specification servers block.'
  humanURL: https://docs.dashboard.accredify.io/
  baseURL: https://dashboard.accredify.io/api
