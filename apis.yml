aid: accredify0604
name: Accredify
description: Accredify is a Singapore-headquartered verifiable-credentials and "TrustTech" platform that
  lets organisations create, issue, verify and manage tamper-proof digital documents. Its Nexus platform
  exposes an OAuth 2.0 client-credentials REST API covering organisation users, groups, roles and user
  tokens (Auth module), workflow definitions, workflow runs, documents, design/document templates and
  courses (Workflow module), and document verification plus verifiable-data key extraction (Verification
  module). A separate Accredify Dashboard API (v1 and v2) covers OAuth 2.0 grants, OpenBadges issuance
  and revocation, batch upload/issue, certificate revocation, courses, templates and email templates.
  Accredify also operates a live OpenID for Verifiable Credential Issuance (OID4VCI) credential issuer
  at nexus.accredify.io, publishing mso_mdoc credential configurations for ISO/IEC 18013-5 mobile driving
  licence and ISO/IEC 23220 photo ID. The company issues in W3C VC, EBSI, mDL, SMART Health Card, OpenCerts,
  OpenAttestation and OpenBadges standards, serves education, healthcare, associations, licensing and
  public-sector customers across nine markets, and built Singapore's HealthCerts COVID-19 verification
  system.
