        - verification-suite
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  not_tampered:
                    type: boolean
                  valid_issuer:
                    type: boolean
                  recognized_institute:
                    type: boolean
                  not_revoked:
                    type: boolean
                  trace_id:
                    type: string
                  verified_data:
                    type: object
                    description: Returned when `keys` are specified in the request. Maps each requested key (dot-notation path) to its verified value.
                    additionalProperties:
                      type: string
                x-examples:
                  Example 1:
                    not_tampered: true
                    valid_issuer: true
                    recognized_institute: true
                    not_revoked: true
                    trace_id: 80c426f4-398e-4760-b030-3dee593c819e
              examples:
                Valid document:
                  value:
                    not_tampered: true
                    valid_issuer: true
                    recognized_institute: true
                    not_revoked: true
                    trace_id: 80c426f4-398e-4760-b030-3dee593c819e
                Tampered document:
