                    not_tampered: false
                    valid_issuer: true
                    recognized_institute: true
                    not_revoked: true
                    trace_id: 80c426f4-398e-4760-b030-3dee593c819e
                Document not issued:
                  value:
                    not_tampered: true
                    valid_issuer: false
                    recognized_institute: true
                    not_revoked: true
                    trace_id: 80c426f4-398e-4760-b030-3dee593c819e
                Issuer verification failed:
