      parameters:
      - name: keys[]
        in: query
        required: false
        description: When sending the credential as a raw JSON request body, specify the keys whose verified values should be returned in `verified_data`. Repeat this parameter for multiple keys. Retrieve available keys from the /extract-keys endpoint.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: expectedHolder
        in: query
        required: false
        description: When sending the credential as a raw JSON request body, constrains a VerifiableCredential 2.0 presentation's holder to this exact DID. See the `expectedHolder` form field for details.
        schema:
          type: string
      - name: allowedIssuers
        in: query
        required: false
        description: When sending the credential as a raw JSON request body, supplies the allowed issuers for VerifiableCredential 2.0 documents as a JSON-encoded array of objects, each with a `did` and an optional `publicKeyMultibase`. See the `allowedIssuers` form field for details.
        schema:
          type: string
        example: '[{"did":"did:example:accredify","publicKeyMultibase":"z6Mk..."},{"did":"did:example:partner"}]'
      description: 'Endpoint allows for the verification of documents and credentials.


        Currently supported types:

        - OpenCerts

        - OpenAttestation

        - OpenBadges

        - Verifiable PDFs

        - VerifiableCredential 2.0'
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth2 client credentials flow
      flows:
        clientCredentials:
