                    not_tampered: true
                    valid_issuer: true
                    recognized_institute: false
                    not_revoked: true
                    trace_id: 80c426f4-398e-4760-b030-3dee593c819e
                Document revoked:
                  value:
                    not_tampered: true
                    valid_issuer: true
                    recognized_institute: true
                    not_revoked: false
                    trace_id: 80c426f4-398e-4760-b030-3dee593c819e
                OpenCert with Keys specified:
