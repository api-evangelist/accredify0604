  /v1/revokeCerts:
    post:
      tags:
        - Revoke
      summary: Revoked certificates by their hashes
      description: >-
        Revokes certificates that were issued by their certificate hash, also supports the removal of the certificate
        from MySF
      operationId: revokeCerts
      requestBody:
        description: Information require to create a batch
        required: true
        content:
          application/json:
            schema:
              required:
                - instance
                - targetHashes
                - delete
                - timestamp
              properties:
                instance:
                  description: Whether this is meant for the testnet (TST) or mainnet (PRD)
                  type: string
                  example: TST
                targetHashes:
                  description: The hashes of the certificates to revoke
                  type: array
                  items:
                    type: string
                    example: '0x95c939b9a64a16ff70590cbed058d141971501d93af8baa4cdd7424ac87fc95c'
                delete:
                  description: Whether to remove the certificate from MySF
                  type: string
                  example: 'false'
                timestamp:
                  description: Timestamp of the request
                  type: string
                  format: date-time
                  example: '2019-09-11T17:21:45+08:00'
              type: object
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                properties:
                  instance:
                    description: Whether this is meant for the testnet (TST) or mainnet (PRD)
                    type: string
                    example: TST
                  timestamp:
                    description: Timestamp of the request
                    type: string
                    format: date-time
                    example: '2019-09-11T17:21:45+08:00'
                  certificates:
                    description: The hashes of the certificates to revoke
                    type: array
                    items:
                      type: string
                      example: '0x95c939b9a64a16ff70590cbed058d141971501d93af8baa4cdd7424ac87fc95c'
                  transactionHash:
                    type: string
                    example: '0x5c82b6ac1b4a85542ad46fde57688986852b46a6d4203631a0688e804b1f0858'
                type: object
        '400':
          description: Error
          content:
            application/json:
              schema:
                properties:
                  instance:
                    description: Whether this is meant for the testnet (TST) or mainnet (PRD)
                    type: string
                    example: TST
                  timestamp:
                    description: Timestamp of the request
                    type: string
                    format: date-time
                    example: '2019-09-11T17:21:45+08:00'
                  status:
                    type: string
                    example: ERROR
                  code:
                    type: string
                    example: R402
                  message:
                    type: string
                    example: These hashes were not found
                type: object
  /v1/sendEmails:
    post:
      tags:
        - Issue
      summary: Triggers the sending of emails for the certificates provided
      description: Triggers the sending of emails based on the certificate hashes provided
      operationId: sendEmails
      requestBody:
        description: Information on the certificates that should be sent by email
        required: true
        content:
          application/json:
            schema:
              properties:
                certificates:
                  type: array
                  items:
                    required:
                      - certHash
                      - encrypt
                    properties:
                      certHash:
                        description: The certificate's hash
                        type: string
                        example: '0x36b4232312e454252904ca36b1bf208909481ee0d5e593670af08086411b73c5'
                      encrypt:
                        description: Whether the files should be encrypted upon distribution
                        type: boolean
                        example: 'true'
                    type: object
              type: object
      responses:
        '200':
          description: 'Success, all the emails will be sent for the specified certs'
          content:
            application/json:
              schema:
                properties:
                  message:
                    description: The sucess message
                    type: string
                    example: Successfully sent emails
                  code:
                    description: The status of the call
                    type: string
                    example: '200'
                  status:
                    description: The status of the batch
                    type: string
                    example: '200'
                type: object
        '400':
          description: Error
          content:
            application/json:
              schema:
                properties:
                  status:
                    description: The reason why the call was unsuccessful
                    type: string
                    example: Certificate(s) could not be sent as they are invalid
                  errors:
                    properties:
                      certHash:
                        type: array
                        items:
                          description: Why the certificate could not be sent
                          type: string
                          example: '''0x36b4232312e454252904ca36b1bf208909481ee0d5e593670af08086411b73c5'' does not exist'
                    type: object
                type: object
      security:
        - bearerAuth: []
  /ext/getCertificates:
    post:
      tags:
        - External App Integrations
      summary: Retrieves an array of Certificates
      description: Retrieves a user's Certificates based on their identification number
      operationId: getCertificates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - identificationNumber
                - parameters
              properties:
                identificationNumber:
                  description: >-
                    Identification number of the user whose records are to be retrieved, can be NRIC, FIN, Passport,
                    Student ID
                  type: string
                  default: S0000000A
                  example: S0000000A
                parameters:
                  description: The information related to the certificate that should be returned
                  type: string
                  example: 'certName,recipientNric,recipientPassport,recipientName,recipientDob,recipientEmail,hash,qr,shareLink'
              type: object
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      properties:
                        id:
                          description: The Certificate's ID
                          type: string
                          example: Sample001
                        certName:
                          description: The name of the Certificate
                          type: string
                          example: Computer Science 101
                        recipientNric:
                          description: The user's NRIC number
                          type: string
                          example: S0000000A
                        recipientPassport:
                          description: The user's passport number
                          type: string
                          example: E0000000A
                        recipientStudentId:
                          description: The user's student id
                          type: string
                          example: '123123'
                        recipientName:
                          description: The user's name
                          type: string
                          example: John Doe
                        recipientDob:
                          description: The user's date of birth in yyyy-mm-dd
                          type: string
                          example: '2021-03-10'
                        recipientEmail:
                          description: The user's email address
                          type: string
                          example: test@email.com
                        hash:
                          description: The certificate's unique hash
                          type: string
                          example: '0x68e6e789de59847ba0e4622460ff26a694ea1443064b7770367d42aba1b93d95'
                        qr:
                          description: The certificate's QR code in Base64
                          type: string
                          example: 'data:image/png;base64'
                        shareLink:
                          description: The sharelink that leads to the Certificate
                          type: string
                          example: 'https://staging.accredify.io/verify?id=7198f2ad-c6e3-4d2a-bfa7-c3284e154e7c'
                      type: object
                type: object
        '400':
          description: Error
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                    example: The identificationNumber field is required
                type: object
components:
  responses:
    SuccessRequest:
      description: Success request
    NoContentRequest:
      description: No content request
    RedirectRequest:
      description: Redirect request
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            properties:
              status:
                description: The HTTP status code
                type: integer
                example: 400
              message:
                description: The message returned from the request
                type: string
                example: 'We couldn''t find you, please try again.'
            type: object
    UnauthenticatedRequest:
      description: Unauthenticated request
      content:
        application/json:
          schema:
            properties:
              status:
                description: The HTTP status code
                type: integer
                example: 401
              message:
                description: The message returned from the request
                type: string
                example: Unauthenticated. You might have provided an invalid access token or your token has already expired.
            type: object
    UnauthorisedRequest:
      description: Unauthorised request
      content:
        application/json:
          schema:
            properties:
              status:
                description: The HTTP status code
                type: integer
                example: 403
              message:
                description: The message returned from the request
                type: string
                example: Unauthorised. You might have provided an invalid access token or your token has already expired.
            type: object
    NotFoundRequest:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            properties:
              status:
                description: The HTTP status code
                type: integer
                example: 404
              message:
                description: The message returned from the request
                type: string
                example: Please ensure you are making the request to the correct endpoint.
            type: object
    UnprocessableEntityRequest:
      description: Unprocessable entity
      content:
        application/json:
          schema:
            properties:
              status:
                description: The HTTP status code
                type: integer
                example: 422
              error:
                description: A list of the errors in the request
                properties:
                  string:
                    type: array
                    items:
                      type: string
                      example: error message
                type: object
            type: object
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            properties:
              status:
                description: The HTTP status code
                type: integer
                example: 429
              message:
                description: The message returned from the request
                type: string
                example: You're submitting requests too quickly. Please retry again after 60 seconds.
            type: object
    InternalErrorRequest:
      description: 'Internal error, please contact us at support@accredify with the code'
      content:
        application/json:
          schema:
            properties:
              status:
                description: The HTTP status code
                type: integer
                example: 500
              code:
                description: The error code for reporting and internal reference
                type: string
                example: E400
              message:
                description: The message returned from the request
                type: string
                example: >-
                  There was an unexpected error while performing your last action. Please contact us at
                  support@accredify.io with the error code for internal reference
            type: object
  securitySchemes:
    bearerAuth:
      type: http
      description: 'JWT Authorization header using the Bearer scheme. Example: ''Authorization: Bearer {token}'''
      bearerFormat: JWT
      scheme: bearer
tags:
  - name: OAuth 2.0
    description: OAuth 2.0
  - name: OpenBadges
    description: OpenBadges
  - name: Issue
    description: Issue
  - name: Revoke
    description: Revoke
  - name: External App Integrations
    description: External App Integrations
