  /documents:
    get:
      tags:
        - Documents
      summary: Get documents
      description: >-
        Returns a paginated list of documents scoped to the authenticated user's issuer or institution affiliation. File
        payloads are excluded by default.
      operationId: getDocuments
      parameters:
        - name: page
          in: query
          description: The page number to retrieve.
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          description: The number of documents per page.
          required: false
          schema:
            type: integer
            default: 10
            enum:
              - 10
              - 25
              - 50
              - 100
        - name: exclude_files
          in: query
          description: Whether to exclude base64-encoded file payloads. Defaults to true for collection responses.
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Documents retrieved successfully.
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      properties:
                        id:
                          description: Document ID
                          type: integer
                        hash:
                          description: Document hash
                          type:
                            - string
                            - 'null'
                        type:
                          description: Document type
                          type: string
                        status:
                          description: Current status of the document
                          type: string
                        links:
                          description: Document links
                          type: object
                        meta_data:
                          description: Document metadata
                          type: object
                        recipient:
                          description: Recipient data
                          type: object
                        files:
                          description: 'Base64-encoded files, included only when exclude_files is false'
                          type: object
                      type: object
                  links:
                    description: Pagination links
                    type: object
                  meta:
                    description: Pagination metadata
                    type: object
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthenticatedRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntityRequest'
        '429':
