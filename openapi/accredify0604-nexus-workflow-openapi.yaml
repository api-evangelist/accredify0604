                  type: string
                  enum:
                    - academic
                    - professional
                  description: Skills passport course type
                workflow_uuids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Complete desired set of workflow UUIDs the course should be attached to. The course is attached to newly listed workflows, detached from workflows that are no longer listed, and all affected workflows are republished. An empty array clears all workflow associations.
              required:
                - title
                - ssec
                - eqa
                - fos
                - skills_passport_course_type
                - workflow_uuids
            examples:
