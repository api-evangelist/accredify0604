      description: 'Partially update a course. Omitted fields are left unchanged; provided fields result in a new course version with the updated values. ssec, eqa and fos describe a single SSEC framework selection and must be provided together. The course code and group cannot be changed after creation. If workflow_uuids is provided, it is treated as the complete desired set of workflow associations: the course is attached to newly listed workflows, detached from workflows that are no longer listed, and every affected workflow is republished as a new version. An empty array clears all workflow associations. When workflow_uuids is omitted, the current associations are kept and every attached workflow is automatically republished with the new course version.'
      tags: []
      security:
        - OAuth2:
            - 'courses:write'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 255
                  description: Course title
                ssec:
                  type: string
                  enum:
                    - '2020'
                    - '2015'
                  description: SSEC version
                eqa:
                  type: string
                  description: EQA code from SSEC framework
                fos:
